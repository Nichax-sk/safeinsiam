name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Test-only database for the integration tests. These credentials are
      # throwaway values for this runner, not secrets.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: safeinsiam_test
          POSTGRES_USER: safeinsiam_test
          POSTGRES_PASSWORD: safeinsiam_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U safeinsiam_test -d safeinsiam_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Vet integration tests
        run: go vet -tags=integration ./...

      - name: Test
        run: go test ./...

      - name: Integration test
        run: go test -tags=integration ./...
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "5432"
          TEST_DB_NAME: safeinsiam_test
          TEST_DB_USER: safeinsiam_test
          TEST_DB_PASSWORD: safeinsiam_test_only
          TEST_DB_SSLMODE: disable

      - name: Build
        run: go build ./...

  frontend:
    name: Frontend (Nuxt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
